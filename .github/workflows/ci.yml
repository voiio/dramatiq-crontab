name: CI
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.15"
      - run: uv build
      - run: uv run --no-project --with twine twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*
  pytest:
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
        django-version:
          - "5.2" # LTS
          - "6.0"
          - "6.1"
        extras:
          - "test"
          - "test,sentry"
          - "test,redis"
          - "test,sentry,redis"
        resolution:
          - "highest"
        exclude:
          - python-version: "3.11"
            django-version: "6.0"
          - python-version: "3.11"
            django-version: "6.1"
        include:
          - python-version: "3.11"
            django-version: "5.2"
            extras: "test,sentry,redis"
            resolution: "lowest-direct"
    services:
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379/0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv venv
      - if: matrix.resolution == 'highest'
        run: uv pip install ".[${{ matrix.extras }}]" "django~=${{ matrix.django-version }}.0"
      - if: matrix.resolution == 'lowest-direct'
        run: |
          uv pip install --resolution lowest-direct -r pyproject.toml --all-extras "django~=${{ matrix.django-version }}.0"
          uv pip install --no-deps .
      - run: uv pip list
      - run: uv run --no-project python -m pytest
      - uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: coverage.xml
          fail_ci_if_error: true
          flags: python-${{ matrix.python-version }}-django-${{ matrix.django-version }}-${{ matrix.resolution }}
